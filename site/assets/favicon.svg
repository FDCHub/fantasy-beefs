<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FantasyStakes">
  <title>FantasyStakes</title>
  <!-- Original FantasyStakes site mark: an FS monogram in the locked palette,
       carrying the wordmark treatment (F ivory, S gold) down to 16px. No third
       party mark of any kind appears here. -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0b0b0a"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="#c8a24d" stroke-width="2"/>
  <text x="32" y="44" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif"
        font-size="34" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#f3eddc">F</tspan><tspan fill="#c8a24d">S</tspan>
  </text>
</svg>
