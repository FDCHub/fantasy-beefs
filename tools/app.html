<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fantasy Beefs</title>
<link rel="stylesheet" href="components.css">
<style>
/* Shell-only overrides — nothing component-level goes here */
html, body {
  height: 100%;
  overflow: hidden;
}

/* VP: Standings */
.stat-card--mine {
  border-color: var(--orange);
  border-left: 3px solid var(--orange);
}
.vp-status {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-lt);
  padding: 40px 0;
}
.vp-status.error { color: var(--red); }

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
}

.tab-views {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.tab-view {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px calc(var(--nav-h) + 16px);
}
</style>
</head>
<body>

<div id="app">

  <!-- ── Auth Header ─────────────────────────────────────────────── -->
  <header class="auth-header">
    <div class="auth-header__title">Fantasy <em>Beefs</em></div>
    <div class="auth-header__gm" id="header-gm">GM · Team 1</div>
  </header>

  <!-- ── Tab Content ────────────────────────────────────────────── -->
  <div class="tab-views">

    <div id="tab-league" class="tab-view active">
      <div class="section-label" id="standings-label">Standings</div>
      <div id="vp-standings">
        <div class="vp-status">Loading standings...</div>
      </div>
    </div>

    <div id="tab-action" class="tab-view">
      <div class="placeholder-vp">My Action — VP content coming</div>
    </div>

    <div id="tab-team" class="tab-view">
      <div class="placeholder-vp">My Team — VP content coming</div>
    </div>

    <div id="tab-account" class="tab-view">
      <div class="placeholder-vp">My Account — VP content coming</div>
    </div>

    <div id="tab-commish" class="tab-view">
      <div class="placeholder-vp">My Commish — VP content coming</div>
    </div>

  </div>

  <!-- ── Bottom Nav ─────────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="bottom-nav__item active" data-tab="tab-league">
      <span class="bottom-nav__icon">🏆</span>
      My League
    </button>
    <button class="bottom-nav__item" data-tab="tab-action">
      <span class="bottom-nav__icon">🎰</span>
      My Action
    </button>
    <button class="bottom-nav__item" data-tab="tab-team">
      <span class="bottom-nav__icon">🏈</span>
      My Team
    </button>
    <button class="bottom-nav__item" data-tab="tab-account">
      <span class="bottom-nav__icon">💰</span>
      My Account
    </button>
    <button class="bottom-nav__item" data-tab="tab-commish">
      <span class="bottom-nav__icon">⚙️</span>
      My Commish
    </button>
  </nav>

</div><!-- /#app -->

<script>
const API_BASE   = 'https://fantasy-beefs-production.up.railway.app';
const GM_TEAM_ID = 1;

/* ── Tab switching ──────────────────────────────────────────────── */

var _activeTab = 'tab-league';

function showTab(tabId) {
  document.querySelectorAll('.tab-view').forEach(function(el) {
    el.classList.remove('active');
  });
  document.querySelectorAll('.bottom-nav__item').forEach(function(btn) {
    btn.classList.remove('active');
  });

  var view = document.getElementById(tabId);
  if (view) view.classList.add('active');

  var btn = document.querySelector('[data-tab="' + tabId + '"]');
  if (btn) btn.classList.add('active');

  _activeTab = tabId;
}

document.querySelectorAll('.bottom-nav__item').forEach(function(btn) {
  btn.addEventListener('click', function() {
    showTab(btn.dataset.tab);
  });
});

/* ── Standings VP ───────────────────────────────────────────────── */

const CURRENT_WEEK = 1;

async function loadStandings() {
  const el    = document.getElementById('vp-standings');
  const label = document.getElementById('standings-label');

  el.innerHTML = '<div class="vp-status">Loading standings...</div>';

  try {
    const res = await fetch(API_BASE + '/league/standings');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const teams = await res.json();

    label.textContent = 'Standings — Week ' + CURRENT_WEEK;

    if (!teams.length) {
      el.innerHTML = '<div class="vp-status">No standings data.</div>';
      return;
    }

    el.innerHTML = teams.map(function(team) {
      var mine        = team.team_id === GM_TEAM_ID;
      var streakStart = team.streak ? team.streak[0] : '';
      var streakClass = streakStart === 'W' ? 'positive' : streakStart === 'L' ? 'negative' : '';
      return [
        '<div class="stat-card' + (mine ? ' stat-card--mine' : '') + '">',
          '<div class="stat-card__header">',
            '<div style="display:flex;align-items:center;gap:8px;">',
              '<span class="stat-card__rank">#' + team.rank + '</span>',
              '<span class="stat-card__name">' + team.team_name + '</span>',
            '</div>',
            mine ? '<span class="badge your-game">You</span>' : '',
          '</div>',
          '<div class="stat-card__grid">',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">W‑L</span>',
              '<span class="stat-card__cell-value">' + team.wins + '‑' + team.losses + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">PF</span>',
              '<span class="stat-card__cell-value">' + team.points_for.toFixed(1) + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">PA</span>',
              '<span class="stat-card__cell-value">' + team.points_against.toFixed(1) + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">Streak</span>',
              '<span class="stat-card__cell-value ' + streakClass + '">' + (team.streak || '—') + '</span>',
            '</div>',
          '</div>',
        '</div>',
      ].join('');
    }).join('');

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load standings.</div>';
  }
}

loadStandings();
</script>

</body>
</html>
