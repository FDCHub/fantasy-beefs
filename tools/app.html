<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Fantasy Beefs</title>
<link rel="stylesheet" href="components.css">
<style>
/* Shell-only overrides — nothing component-level goes here */
html, body {
  height: 100%;
  overflow: hidden;
}

/* VP: Standings */
.stat-card--mine {
  border-color: var(--orange);
  border-left: 3px solid var(--orange);
}
.vp-status {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted-lt);
  padding: 40px 0;
}
.vp-status.error { color: var(--red); }

/* VP: Team Health */
.th-team-name {
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  margin-bottom: 12px;
}

.player-row--starter { border-left: 3px solid var(--green); }
.player-row--bench   { background: var(--bg); opacity: 0.8; }

.th-tile-row {
  display: flex;
  overflow-x: auto;
  flex-wrap: nowrap;
  gap: 3px;
  padding-bottom: 4px;
  margin-bottom: 10px;
  -webkit-overflow-scrolling: touch;
}
.th-tile-row::-webkit-scrollbar { height: 3px; }
.th-tile-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.th-cell {
  flex-shrink: 0;
  width: 30px;
  height: 42px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-family: var(--mono);
  font-size: 7px;
  color: #fff;
}
.th-cell.cell--win    { background: #4caf7d; }
.th-cell.cell--loss   { background: #e57373; }
.th-cell.cell--tossup { background: #f5c842; color: #1a1a1a; }
.th-cell-inner { line-height: 1.4; }

.th-signals { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; }
.th-pill {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  color: #fff;
}
.th-pill--weak  { background: var(--orange-dk); }
.th-pill--bye   { background: var(--gold); }
.th-pill--watch { background: var(--red); }

/* VP: The Book */
.book-pick-note {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--navy-lt);
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255,255,255,0.12);
}

.bet-slip-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 150;
}
.bet-slip-backdrop.open { display: block; }

.bs-stake-input {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 700;
  border: none;
  border-bottom: 1.5px solid var(--border);
  background: transparent;
  color: var(--ink);
  width: 72px;
  text-align: right;
  outline: none;
  -moz-appearance: textfield;
}
.bs-stake-input::-webkit-inner-spin-button,
.bs-stake-input::-webkit-outer-spin-button { -webkit-appearance: none; }

/* VP: Wallet */
.wallet-bucket {
  padding: 4px 0 8px;
}
.wallet-amount {
  font-family: var(--mono);
  font-size: 24px;
  font-weight: 800;
  letter-spacing: -0.02em;
  margin-bottom: 2px;
  color: var(--ink);
}
.wallet-amount.faab     { color: var(--blue); }
.wallet-amount.bankroll { color: var(--orange-dk); }
.wallet-amount.real     { color: var(--green); }
.wallet-sublabel {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
}

.tab-views {
  flex: 1;
  overflow: hidden;
  position: relative;
}

.tab-view {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 14px calc(var(--nav-h) + 16px);
}
</style>
</head>
<body>

<div id="app">

  <!-- ── Auth Header ─────────────────────────────────────────────── -->
  <header class="auth-header">
    <div class="auth-header__title">Fantasy <em>Beefs</em></div>
    <div class="auth-header__gm" id="header-gm">GM · Team 1</div>
  </header>

  <!-- ── Tab Content ────────────────────────────────────────────── -->
  <div class="tab-views">

    <div id="tab-league" class="tab-view active">
      <div class="section-label" id="standings-label">Standings</div>
      <div id="vp-standings">
        <div class="vp-status">Loading standings...</div>
      </div>
    </div>

    <div id="tab-action" class="tab-view">

      <!-- Pool card render target -->
      <div id="vp-pool-header"></div>

      <!-- Bet matrix -->
      <div class="section-label" id="book-label">The Book</div>
      <div id="vp-the-book">
        <div class="vp-status">Loading The Book...</div>
      </div>

      <!-- Bet slip — position:fixed, viewport-anchored while tab is active -->
      <div class="bet-slip-backdrop" id="bet-slip-backdrop" onclick="closeBetSlip()"></div>
      <div class="bet-slip" id="bet-slip">
        <div class="bet-slip__handle"></div>
        <div class="bet-slip__title" id="bs-title">Bet</div>
        <div class="bet-slip__matchup" id="bs-matchup"></div>
        <div class="bet-slip__row">
          <span class="bet-slip__label">Line</span>
          <span class="bet-slip__value odds" id="bs-line">—</span>
        </div>
        <div class="bet-slip__row">
          <span class="bet-slip__label">Stake ($)</span>
          <span class="bet-slip__value">
            <input class="bs-stake-input" type="number" id="bs-stake"
                   value="10" min="5" max="500">
          </span>
        </div>
        <button class="bet-slip__btn confirm" onclick="placeBetConsole()">Place Beef</button>
      </div>

    </div>

    <div id="tab-team" class="tab-view">
      <div class="section-label" id="team-health-label">My Team</div>
      <div id="vp-team-health">
        <div class="vp-status">Loading team health...</div>
      </div>
    </div>

    <div id="tab-account" class="tab-view">
      <div class="section-label">My Wallet</div>
      <div id="vp-wallet">
        <div class="vp-status">Loading wallet...</div>
      </div>
    </div>

    <div id="tab-commish" class="tab-view">
      <div class="section-label">Commish Settings</div>
      <div id="vp-commish-settings">
        <div class="vp-status">Loading settings...</div>
      </div>
    </div>

  </div>

  <!-- ── Bottom Nav ─────────────────────────────────────────────── -->
  <nav class="bottom-nav">
    <button class="bottom-nav__item active" data-tab="tab-league">
      <span class="bottom-nav__icon">🏆</span>
      My League
    </button>
    <button class="bottom-nav__item" data-tab="tab-action">
      <span class="bottom-nav__icon">🎰</span>
      My Action
    </button>
    <button class="bottom-nav__item" data-tab="tab-team">
      <span class="bottom-nav__icon">🏈</span>
      My Team
    </button>
    <button class="bottom-nav__item" data-tab="tab-account">
      <span class="bottom-nav__icon">💰</span>
      My Account
    </button>
    <button class="bottom-nav__item" data-tab="tab-commish">
      <span class="bottom-nav__icon">⚙️</span>
      My Commish
    </button>
  </nav>

</div><!-- /#app -->

<script>
const API_BASE   = 'https://fantasy-beefs-production.up.railway.app';
const GM_TEAM_ID = 1;
const AUTH_TOKEN = 'dev-stub-token';

function fetchAuth(url) {
  return fetch(url, {
    headers: { 'Authorization': 'Bearer ' + AUTH_TOKEN }
  });
}

/* ── Tab switching ──────────────────────────────────────────────── */

var _activeTab = 'tab-league';

function showTab(tabId) {
  document.querySelectorAll('.tab-view').forEach(function(el) {
    el.classList.remove('active');
  });
  document.querySelectorAll('.bottom-nav__item').forEach(function(btn) {
    btn.classList.remove('active');
  });

  var view = document.getElementById(tabId);
  if (view) view.classList.add('active');

  var btn = document.querySelector('[data-tab="' + tabId + '"]');
  if (btn) btn.classList.add('active');

  _activeTab = tabId;
}

document.querySelectorAll('.bottom-nav__item').forEach(function(btn) {
  btn.addEventListener('click', function() {
    showTab(btn.dataset.tab);
  });
});

/* ── Standings VP ───────────────────────────────────────────────── */

const CURRENT_WEEK = 1;

async function loadStandings() {
  const el    = document.getElementById('vp-standings');
  const label = document.getElementById('standings-label');

  el.innerHTML = '<div class="vp-status">Loading standings...</div>';

  try {
    const res = await fetch(API_BASE + '/league/standings');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const teams = await res.json();

    label.textContent = 'Standings — Week ' + CURRENT_WEEK;

    if (!teams.length) {
      el.innerHTML = '<div class="vp-status">No standings data.</div>';
      return;
    }

    el.innerHTML = teams.map(function(team) {
      var mine        = team.team_id === GM_TEAM_ID;
      var streakStart = '';
      var streakClass = streakStart === 'W' ? 'positive' : streakStart === 'L' ? 'negative' : '';
      return [
        '<div class="stat-card' + (mine ? ' stat-card--mine' : '') + '">',
          '<div class="stat-card__header">',
            '<div style="display:flex;align-items:center;gap:8px;">',
              '<span class="stat-card__rank">#' + team.rank + '</span>',
              '<span class="stat-card__name">' + team.team_name + '</span>',
            '</div>',
            mine ? '<span class="badge your-game">You</span>' : '',
          '</div>',
          '<div class="stat-card__grid">',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">W‑L</span>',
              '<span class="stat-card__cell-value">' + team.wins + '‑' + team.losses + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">PF</span>',
              '<span class="stat-card__cell-value">' + (team.pf || 0).toFixed(1) + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">PA</span>',
              '<span class="stat-card__cell-value">' + (team.pa || 0).toFixed(1) + '</span>',
            '</div>',
            '<div class="stat-card__cell">',
              '<span class="stat-card__cell-label">Streak</span>',
              '<span class="stat-card__cell-value">' + (team.streak || '—') + '</span>',
            '</div>',
          '</div>',
        '</div>',
      ].join('');
    }).join('');

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load standings.</div>';
  }
}

loadStandings();

/* ── Team Health VP ─────────────────────────────────────────────── */

function _healthPlayerRow(player, isStarter) {
  var inj = (player.injury_status || '').toLowerCase();
  var injClass = '', injLabel = '';
  if      (inj === 'out')          { injClass = 'out';      injLabel = 'OUT'; }
  else if (inj === 'ir')           { injClass = 'ir';       injLabel = 'IR';  }
  else if (inj === 'doubtful')     { injClass = 'doubtful'; injLabel = 'D';   }
  else if (inj === 'questionable') { injClass = 'question'; injLabel = 'Q';   }
  return [
    '<div class="player-row ' + (isStarter ? 'player-row--starter' : 'player-row--bench') + '">',
      '<span class="player-row__pos">'  + player.position + '</span>',
      '<span class="player-row__name">' + player.name + '</span>',
      '<span class="player-row__proj">' + player.projected_pts.toFixed(1) + '</span>',
      injClass ? '<span class="player-row__injury ' + injClass + '">' + injLabel + '</span>' : '',
    '</div>',
  ].join('');
}

function _horizonRow(label, weeks) {
  if (!weeks || !weeks.length) return '';
  var tiles = weeks.map(function(w) {
    var cls    = w.win_prob > 0.55 ? 'cell--win' : w.win_prob < 0.45 ? 'cell--loss' : 'cell--tossup';
    var margin = (w.point_margin >= 0 ? '+' : '') + w.point_margin.toFixed(1);
    return '<div class="th-cell ' + cls + '"><div class="th-cell-inner"><div>Wk ' + w.week + '</div><div>' + margin + '</div></div></div>';
  }).join('');
  return '<div class="section-label">' + label + '</div><div class="th-tile-row">' + tiles + '</div>';
}

function _diagnostics(weakest, bye, flags) {
  var pills = [];
  if (weakest) pills.push('<span class="th-pill th-pill--weak">Weakest: ' + weakest + '</span>');
  (bye   || []).forEach(function(w) { pills.push('<span class="th-pill th-pill--bye">Bye Wk ' + w + '</span>'); });
  (flags || []).forEach(function(f) { pills.push('<span class="th-pill th-pill--watch">Watch: ' + f + '</span>'); });
  if (!pills.length) return '';
  return '<div class="section-label">Signals</div><div class="th-signals">' + pills.join('') + '</div>';
}

async function loadTeamHealth() {
  var el    = document.getElementById('vp-team-health');
  var label = document.getElementById('team-health-label');

  el.innerHTML = '<div class="vp-status">Loading team health...</div>';

  try {
    var base = API_BASE + '/health/team/' + GM_TEAM_ID;
    var results = await Promise.all([
      fetch(base + '/lineup?week=' + CURRENT_WEEK).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
      fetch(base + '?week=' + CURRENT_WEEK).then(function(r)        { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    ]);
    var lineupData = results[0];
    var healthData = results[1];

    label.textContent = 'My Team — Week ' + CURRENT_WEEK;

    var html = '';
    html += '<div class="th-team-name">' + lineupData.team_name + '</div>';

    html += '<div class="section-label">Starters</div>';
    html += lineupData.starters.map(function(p) { return _healthPlayerRow(p, true);  }).join('');

    html += '<div class="section-label">Bench</div>';
    html += lineupData.bench.map(function(p)    { return _healthPlayerRow(p, false); }).join('');

    html += _horizonRow('Season Outlook', healthData.rest_of_season);
    html += _horizonRow('Playoffs',       healthData.playoffs);
    html += _diagnostics(healthData.weakest_position, healthData.bye_clusters, healthData.future_weakness_flags);

    el.innerHTML = html;

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load team.</div>';
  }
}

loadTeamHealth();

/* ── The Book VP ────────────────────────────────────────────────── */

const LEAGUE_ID = 1;

var _bookCtx = { matchupId: null, betType: null, line: null, label: null };

function toggleCard(id) {
  var card = document.getElementById(id);
  if (card) card.classList.toggle('expanded');
}

function openBetSlip(matchupLabel, betType, line, matchupId) {
  _bookCtx = { matchupId: matchupId, betType: betType, line: line, label: matchupLabel };
  document.getElementById('bs-title').textContent   = betType;
  document.getElementById('bs-matchup').textContent = matchupLabel;
  document.getElementById('bs-line').textContent    = line;
  document.getElementById('bs-stake').value         = '10';
  document.getElementById('bet-slip').classList.add('open');
  document.getElementById('bet-slip-backdrop').classList.add('open');
}

function closeBetSlip() {
  document.getElementById('bet-slip').classList.remove('open');
  document.getElementById('bet-slip-backdrop').classList.remove('open');
}

function placeBetConsole() {
  var stake = parseFloat(document.getElementById('bs-stake').value) || 0;
  console.log('[Place Beef]', _bookCtx.betType, '| matchup', _bookCtx.matchupId,
              '| line:', _bookCtx.line, '| stake: $' + stake.toFixed(2));
  closeBetSlip();
}

function _poolCardHtml(predictions) {
  var myPick = (predictions || []).find(function(p) { return p.team_id === GM_TEAM_ID; });
  var pickNote = myPick
    ? 'Your Worst Beat pick: <strong>' + (myPick.predicted_worst_beat_name || 'Team ' + myPick.predicted_worst_beat_team_id) + '</strong>'
    : 'No Worst Beat pick submitted yet.';
  return [
    '<div class="pool-card">',
      '<div class="pool-card__title">The Pool — Week ' + CURRENT_WEEK + '</div>',
      '<div class="pool-card__pots">',
        '<div class="pool-card__pot">',
          '<div class="pool-card__pot-label">Biggest Winner</div>',
          '<div class="pool-card__pot-value">$—</div>',
        '</div>',
        '<div class="pool-card__pot">',
          '<div class="pool-card__pot-label">Worst Beat</div>',
          '<div class="pool-card__pot-value">$—</div>',
        '</div>',
        '<div class="pool-card__pot">',
          '<div class="pool-card__pot-label">Spec Teams</div>',
          '<div class="pool-card__pot-value">$—</div>',
        '</div>',
      '</div>',
      '<div class="book-pick-note">' + pickNote + '</div>',
    '</div>',
  ].join('');
}

var _BET_TYPES = [
  { key: 'straight',   label: 'Moneyline' },
  { key: 'spread',     label: 'Spread'    },
  { key: 'over_under', label: 'O/U'       },
  { key: 'prop',       label: 'Prop'      },
];

function _betChips(matchup, bets) {
  var teamLabel = matchup.teams.map(function(t) { return t.team_name; }).join(' vs ');
  return _BET_TYPES.map(function(type) {
    var hit  = (bets || []).find(function(b) { return b.bet_type === type.key; });
    var ml   = hit && hit.moneyline != null ? hit.moneyline : null;
    var line = ml != null ? (ml > 0 ? '+' : '') + ml : '—';
    var lineFrag = ml != null
      ? ' <span style="opacity:0.7;font-size:9px;font-weight:700;">' + line + '</span>'
      : '';
    return [
      '<button class="bet-chip" onclick="openBetSlip(',
        '\'' + teamLabel.replace(/'/g, "\\'") + '\',',
        '\'' + type.label + '\',',
        '\'' + line + '\',',
        matchup.matchup_id,
      ')">',
        type.label, lineFrag,
      '</button>',
    ].join('');
  }).join('');
}

function _matchupCardHtml(matchup, gmMatchupId, gmBets) {
  var isGm  = matchup.matchup_id === gmMatchupId;
  var t1    = matchup.teams[0] || { team_name: '—' };
  var t2    = matchup.teams[1] || { team_name: '—' };
  var cid   = 'mc-' + matchup.matchup_id;
  var badge = isGm ? '<span class="badge your-game">Your Game</span>' : '';
  return [
    '<div class="opponent-card' + (isGm ? ' expanded' : '') + '" id="' + cid + '">',
      '<div class="opponent-card__header" onclick="toggleCard(\'' + cid + '\')">',
        '<div>',
          '<div class="opponent-card__name">' + t1.team_name + ' vs ' + t2.team_name + '</div>',
        '</div>',
        '<div class="opponent-card__odds">',
          badge,
          '<span class="opponent-card__chevron">▾</span>',
        '</div>',
      '</div>',
      '<div class="opponent-card__body">',
        '<div class="bet-chips">',
          _betChips(matchup, isGm ? gmBets : []),
        '</div>',
      '</div>',
    '</div>',
  ].join('');
}

async function loadTheBook() {
  var el        = document.getElementById('vp-the-book');
  var poolEl    = document.getElementById('vp-pool-header');
  var bookLabel = document.getElementById('book-label');

  el.innerHTML = '<div class="vp-status">Loading The Book...</div>';

  try {
    // Step 1: standings → matchup pairs + GM's matchup_id
    var sRes = await fetch(API_BASE + '/league/standings');
    if (!sRes.ok) throw new Error('HTTP ' + sRes.status);
    var teams = await sRes.json();

    var gmTeam      = teams.find(function(t) { return t.team_id === GM_TEAM_ID; });
    var gmMatchupId = (gmTeam && gmTeam.matchup_id) ? gmTeam.matchup_id : 1;

    var byMid = {};
    teams.forEach(function(t) {
      var mid = t.matchup_id || gmMatchupId;
      if (!byMid[mid]) byMid[mid] = [];
      byMid[mid].push(t);
    });
    var matchups = Object.keys(byMid).map(function(mid) {
      return { matchup_id: parseInt(mid, 10), teams: byMid[mid] };
    });

    // Step 2: bets for GM's matchup + pool predictions (parallel, non-fatal)
    var parallel = await Promise.all([
      fetch(API_BASE + '/bets/' + gmMatchupId)
        .then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
      fetch(API_BASE + '/pool/predictions/' + LEAGUE_ID + '/' + CURRENT_WEEK)
        .then(function(r) { return r.ok ? r.json() : []; }).catch(function() { return []; }),
    ]);
    var gmBets      = parallel[0];
    var predictions = parallel[1];

    bookLabel.textContent = 'The Book — Week ' + CURRENT_WEEK;
    poolEl.innerHTML = _poolCardHtml(predictions);

    // GM's matchup first, then rest sorted by matchup_id
    matchups.sort(function(a, b) {
      if (a.matchup_id === gmMatchupId) return -1;
      if (b.matchup_id === gmMatchupId) return  1;
      return a.matchup_id - b.matchup_id;
    });

    el.innerHTML = matchups.map(function(m) {
      return _matchupCardHtml(m, gmMatchupId, gmBets);
    }).join('');

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load The Book.</div>';
  }
}

loadTheBook();

/* ── Wallet VP ──────────────────────────────────────────────────── */

async function loadWallet() {
  var el = document.getElementById('vp-wallet');
  el.innerHTML = '<div class="vp-status">Loading wallet...</div>';

  try {
    var res = await fetchAuth(API_BASE + '/faab/wallet/' + GM_TEAM_ID);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var w = await res.json();

    function fmt(v) { return '$' + (v || 0).toFixed(2); }

    el.innerHTML = [
      '<div class="stat-card">',
        '<div class="stat-card__header">',
          '<span class="stat-card__name">FAAB</span>',
        '</div>',
        '<div class="wallet-bucket">',
          '<div class="wallet-amount faab">' + fmt(w.waiver_balance) + '</div>',
          '<div class="wallet-sublabel">Waiver Budget</div>',
        '</div>',
      '</div>',

      '<div class="stat-card">',
        '<div class="stat-card__header">',
          '<span class="stat-card__name">Betting Bankroll</span>',
        '</div>',
        '<div class="wallet-bucket">',
          '<div class="wallet-amount bankroll">' + fmt(w.bet_balance) + '</div>',
          '<div class="wallet-sublabel">Season Bankroll</div>',
        '</div>',
      '</div>',

      '<div class="stat-card">',
        '<div class="stat-card__header">',
          '<span class="stat-card__name">Real Money</span>',
          w.bet_frozen ? '<span class="badge injury-out">Frozen</span>' : '',
        '</div>',
        '<div class="wallet-bucket">',
          '<div class="wallet-amount real">' + fmt(w.bet_balance - w.bet_pending_exposure) + '</div>',
          '<div class="wallet-sublabel">Versus Balance</div>',
        '</div>',
      '</div>',
    ].join('');

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load wallet.</div>';
  }
}

loadWallet();

/* ── Commish Settings VP ────────────────────────────────────────── */

async function loadCommishSettings() {
  var el = document.getElementById('vp-commish-settings');
  el.innerHTML = '<div class="vp-status">Loading settings...</div>';

  try {
    var res = await fetch(API_BASE + '/pool/config/' + LEAGUE_ID);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var c = await res.json();

    var rollover = c.worst_beat_rollover ? 'Yes' : 'No';

    el.innerHTML = [
      '<div class="stat-card">',
        '<div class="stat-card__header">',
          '<span class="stat-card__name">Pool Config</span>',
        '</div>',
        '<div class="stat-card__grid" style="grid-template-columns:repeat(2,1fr);">',
          '<div class="stat-card__cell">',
            '<span class="stat-card__cell-label">Weekly Buy-In</span>',
            '<span class="stat-card__cell-value">$' + (c.weekly_entry || 0).toFixed(2) + '</span>',
          '</div>',
          '<div class="stat-card__cell">',
            '<span class="stat-card__cell-label">Worst Beat Rollover</span>',
            '<span class="stat-card__cell-value">' + rollover + '</span>',
          '</div>',
        '</div>',
      '</div>',
    ].join('');

  } catch (e) {
    el.innerHTML = '<div class="vp-status error">Could not load settings.</div>';
  }
}

loadCommishSettings();
</script>
