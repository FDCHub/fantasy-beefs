<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Health</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #f5f0eb;
            color: #1a1a2e;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 520px;
            margin: 0 auto;
            padding: 8px 12px 12px;
            gap: 8px;
            overflow: hidden;
        }

        /* ── Header ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 40px;
            flex-shrink: 0;
            border-bottom: 1px solid #d8d0c8;
        }

        .header-label {
            font-family: monospace;
            font-size: 10px;
            text-transform: uppercase;
            color: #888;
            width: 80px;
        }

        .header-label:last-child { text-align: right; }

        .header-name {
            flex: 1;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
        }

        /* ── Section labels ── */
        .section-label {
            font-family: monospace;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
            margin-bottom: 3px;
        }

        /* ── Player cards ── */
        .cards-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 11px;
            overflow: hidden;
        }

        .card.starter { background: #2d5a3d; color: #ffffff; }
        .card.bench   { background: #e8e8e8; color: #1a1a2e; }

        .card .pos {
            font-weight: 700;
            font-size: 10px;
            min-width: 22px;
            flex-shrink: 0;
        }

        .card .name {
            flex: 1;
            font-size: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .card .pts {
            flex-shrink: 0;
            font-size: 10px;
            opacity: 0.85;
        }

        /* ── Week tile rows ── */
        .horizon-row { flex-shrink: 0; }

        .tile-row {
            display: flex;
            overflow-x: auto;
            flex-wrap: nowrap;
            gap: 3px;
            padding-bottom: 2px;
            -webkit-overflow-scrolling: touch;
        }

        .tile-row::-webkit-scrollbar { height: 3px; }
        .tile-row::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

        .cell {
            flex-shrink: 0;
            width: 30px;
            height: 42px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: monospace;
            font-size: 7px;
            color: #ffffff;
        }

        .cell.cell--win    { background: #4caf7d; }
        .cell.cell--loss   { background: #e57373; }
        .cell.cell--tossup { background: #f5c842; color: #1a1a1a; }

        .cell-inner { line-height: 1.4; }

        /* ── Roster signals ── */
        .signals {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            flex-shrink: 0;
        }

        .pill {
            font-family: monospace;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            color: #ffffff;
        }

        .pill--weak  { background: #c4501a; }
        .pill--bye   { background: #8a6a20; }
        .pill--watch { background: #8a2020; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        async function init() {
            try {
                const [lineupData, healthData] = await Promise.all([
                    fetchLineup(),
                    fetchHealth()
                ]);
                render(lineupData, healthData);
            } catch (error) {
                document.getElementById('app').innerHTML =
                    '<div style="padding:20px;color:#c4501a;font-family:monospace">Could not load team data.</div>';
            }
        }

        async function fetchLineup() {
            return await fetch('/health/team/1/lineup?week=1')
                .then(response => response.json());
        }

        async function fetchHealth() {
            return await fetch('/health/team/1?week=1')
                .then(response => response.json());
        }

        function render(lineupData, healthData) {
            const app = document.getElementById('app');
            app.innerHTML = `
                <header class="page-header">
                    <span class="header-label">Team Health</span>
                    <span class="header-name">${lineupData.team_name}</span>
                    <span class="header-label">Week 1</span>
                </header>
                <section>
                    <div class="section-label">Starters</div>
                    <div class="cards-list">
                        ${lineupData.starters.map(p => makePlayerCard(p, true)).join('')}
                    </div>
                </section>
                <section>
                    <div class="section-label">Bench</div>
                    <div class="cards-list">
                        ${lineupData.bench.map(p => makePlayerCard(p, false)).join('')}
                    </div>
                </section>
                ${makeHorizon('Season Outlook', healthData.rest_of_season)}
                ${makeHorizon('Playoffs', healthData.playoffs)}
                <section>
                    ${makeDiagnostics(healthData.weakest_position, healthData.bye_clusters, healthData.future_weakness_flags)}
                </section>
            `;
        }

        function makePlayerCard(player, isStarter) {
            return `
                <div class="card ${isStarter ? 'starter' : 'bench'}">
                    <span class="pos">${player.position}</span>
                    <span class="name">${player.name}</span>
                    <span class="pts">${player.projected_pts.toFixed(1)}</span>
                    ${player.injury_status ? `<span>&#9888;</span>` : ''}
                </div>
            `;
        }

        function makeCell(weekData, large) {
            const cellClass = cellColorClass(weekData.win_prob);
            return `
                <div class="cell ${cellClass}">
                    <div class="cell-inner">
                        <div>Wk ${weekData.week}</div>
                        <div>${weekData.point_margin.toFixed(1)}</div>
                    </div>
                </div>
            `;
        }

        function makeHorizon(label, weeks, large) {
            return `
                <section class="horizon-row">
                    <div class="section-label">${label}</div>
                    <div class="tile-row">
                        ${weeks.map(week => makeCell(week, large)).join('')}
                    </div>
                </section>
            `;
        }

        function makeDiagnostics(weakest, bye, flags) {
            const pills = [];
            if (weakest) pills.push(`<span class="pill pill--weak">Weakest: ${weakest}</span>`);
            bye.forEach(w => pills.push(`<span class="pill pill--bye">Bye Wk ${w}</span>`));
            flags.forEach(p => pills.push(`<span class="pill pill--watch">Watch: ${p}</span>`));
            return `<div class="signals">${pills.join('')}</div>`;
        }

        function cellColorClass(winProb) {
            if (winProb > 0.55) return 'cell--win';
            else if (winProb < 0.45) return 'cell--loss';
            else return 'cell--tossup';
        }

        function blurPx(confidence) {
            if (confidence >= 1.0) return 0;
            else if (confidence >= 0.8) return 2;
            else return 5;
        }

        function tierStyle(projectedPts, isStarter) {
            if (!isStarter) return { background: 'rgba(26,26,46,0.04)', color: 'var(--ink)' };
            if (projectedPts >= 18) return { background: 'var(--green)', color: '#ffffff' };
            else if (projectedPts >= 12) return { background: '#e8f5ee', color: 'var(--ink)' };
            else if (projectedPts >= 8) return { background: '#f5f0e0', color: 'var(--ink)' };
            else return { background: '#f5e8e8', color: 'var(--ink)' };
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
