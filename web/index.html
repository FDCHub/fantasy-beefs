<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover exposes env(safe-area-inset-*) so the bottom navigation
     can clear the home indicator without covering tab content.

     PINCH ZOOM IS ENABLED — WP3B §10. `maximum-scale=1.0, user-scalable=no`
     stood here and disabled it outright, which takes away the one accommodation
     a reader with low vision can apply themselves and does it on every surface
     at once. Rev 4.3 §26 puts pinch zoom and accessibility zoom inside the
     certification, and §5 raises the type scale so the app is legible without
     it — neither is a reason to keep the restriction, and both are reasons not
     to. The usual justification for the lock is preventing double-tap zoom on
     form controls; that is addressed by sizing tap targets to 44px and inputs
     at 16px, which §5.1 requires anyway, rather than by removing the gesture. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FantasyStakes">
<meta name="theme-color" content="#0c0a07">
<title>FantasyStakes</title>
<!-- WP3E — PWA metadata. The manifest makes the app installable and names it
     FantasyStakes everywhere a launcher will show it; the apple-touch-icon is
     separate because iOS does not read the manifest for it. -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/shell.css">
<link rel="stylesheet" href="./styles/components.css">
<link rel="stylesheet" href="./styles/wager.css">
<link rel="stylesheet" href="./styles/tabs.css">
<link rel="stylesheet" href="./styles/ledger.css">
<link rel="stylesheet" href="./styles/rules.css">
<link rel="stylesheet" href="./styles/auth.css">
<!-- Rev 4.3 (WP3B). Loaded LAST so the readability foundation and the shell
     adjustments land on top of the Rev 4.2 sheets they supersede, without
     those sheets having to be rewritten in this package. -->
<link rel="stylesheet" href="./styles/rev43.css">
<link rel="stylesheet" href="./styles/standings.css">
<link rel="stylesheet" href="./styles/economy.css">
<!-- Rev 4.3 gameplay surfaces (WP3C). After rev43.css, which is the foundation
     it applies: Play, Preview, the counter sheet, Status, Wrap Up, Account. -->
<link rel="stylesheet" href="./styles/gameplay.css">
</head>
<body>

<!-- Application shell — a single flex column: masthead, panel, navigation.
     The navigation sits in normal flow, so it reserves its own height and
     cannot overlay the active panel at any viewport size. -->
<div class="fs-app" id="fs-app">

  <header class="fs-mast" id="fs-mast"></header>

  <!-- Sign-in gate (Sprint 8 Package 1). Occupies the panel region when no GM
       is signed in. The shell EMPTIES as well as hides the panels and the
       navigation while it shows, so a signed-out page holds no league state. -->
  <section class="fs-gate" id="fs-gate" hidden></section>

  <main class="fs-panels" id="fs-panels"></main>

  <nav class="fs-tabbar" id="fs-tabbar" role="tablist" aria-label="Primary"></nav>

  <!-- Shared pop-out. One sheet host serves every surface; the close control
       is rendered inside it, upper-left. -->
  <div class="fs-overlay" id="fs-overlay" aria-hidden="true">
    <div class="fs-sheet" id="fs-sheet" role="dialog" aria-modal="true"
         aria-labelledby="fs-sheet-title"></div>
  </div>

</div>

<script type="module" src="./js/shell.js"></script>
<!-- WP3E — the service worker exists for INSTALLABILITY and nothing else; it
     caches the static shell network-first and never touches the API. Its own
     header states the rules it keeps. Registration is deliberately late, after
     load, so it never competes with the first paint or the identity read. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js', { scope: './' })
        .catch(() => {
          /* A worker that will not register costs the app nothing: it is an
             installability affordance, not a dependency. The application runs
             identically without it, so the failure is swallowed rather than
             shown to a GM who can do nothing about it. */
        });
    });
  }
</script>
</body>
</html>
